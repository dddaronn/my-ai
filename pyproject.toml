[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai"
version = "0.1.0"
description = "Мини-библиотека для запросов к ИИ через облачный API (с резервным режимом через телефон)"
requires-python = ">=3.8"

[tool.setuptools]
py-modules = ["my_ai"]
